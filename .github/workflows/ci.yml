name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Installer Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Tests customer-service
        run: mvn -f customer-service/pom.xml test -Dtest=CustomerServiceTest

      - name: Tests ebank-service
        run: mvn -f ebank-service/pom.xml test -Dtest=EbankServiceTest