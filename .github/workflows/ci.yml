name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    name: Build and test every service
    runs-on: ubuntu-latest

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      # The repository is authored on Windows, which has no executable bit to
      # record. The mode is set in the index, but a file added later can easily
      # arrive as 100644 again and the runner then fails with "Permission
      # denied" before any test runs.
      - name: Make the Maven wrapper executable
        run: chmod +x mvnw

      # The aggregator POM builds and tests all six services in one command.
      # Naming individual test classes, as this workflow used to, silently
      # skips every test added afterwards.
      - name: Build and test
        run: ./mvnw -B verify

      - name: Publish test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: '**/target/surefire-reports/*.xml'
          if-no-files-found: warn
