# The whole platform, including the agent.
#
# Startup order is expressed with health checks rather than plain depends_on:
# "container started" is not "application ready", and seeding accounts before
# customer-service answers is what used to leave the demo with an empty
# account list and no explanation.

services:

  discovery-service:
    build: ./discovery-service
    container_name: discovery-service
    ports:
      - "8761:8761"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8761/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  config-service:
    build: ./config-service
    container_name: config-service
    ports:
      - "8888:8888"
    environment:
      EUREKA_SERVER: http://discovery-service:8761/eureka/
    depends_on:
      discovery-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8888/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  customer-service:
    build: ./customer-service
    container_name: customer-service
    ports:
      - "8056:8056"
    environment:
      CONFIG_SERVER: http://config-service:8888
      EUREKA_SERVER: http://discovery-service:8761/eureka/
    depends_on:
      config-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8056/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  ebank-service:
    build: ./ebank-service
    container_name: ebank-service
    ports:
      - "8057:8057"
    environment:
      CONFIG_SERVER: http://config-service:8888
      EUREKA_SERVER: http://discovery-service:8761/eureka/
    depends_on:
      # Waits for the owner service: account creation validates the customer,
      # and the startup seeding would otherwise fail silently.
      customer-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8057/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  gateway-service:
    build: ./gateway-service
    container_name: gateway-service
    ports:
      - "8058:8058"
    environment:
      CONFIG_SERVER: http://config-service:8888
      EUREKA_SERVER: http://discovery-service:8761/eureka/
    depends_on:
      ebank-service:
        condition: service_healthy
    healthcheck:
      # Probes a real route rather than /actuator/health, because "the gateway
      # is up" is not what its dependents need. Routes are built from the Eureka
      # registry, which is populated seconds after the gateway starts; an agent
      # connecting during that window gets a 404 and dies at startup. This
      # check passes only once routing genuinely works.
      test: ["CMD", "curl", "-f", "http://localhost:8058/EBANK-SERVICE/accounts"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  agent-service:
    build: ./agent-service
    container_name: agent-service
    ports:
      - "8060:8060"
    environment:
      # Ollama runs on the host, not in this network.
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      LLM_MODEL: ${LLM_MODEL:-llama3.1}
      # The agent reaches the MCP server through the gateway, so it needs no
      # direct knowledge of where ebank-service lives.
      EBANK_MCP_URL: http://gateway-service:8058
    extra_hosts:
      # Makes host.docker.internal resolve on Linux too, where it is not
      # provided by default.
      - "host.docker.internal:host-gateway"
    depends_on:
      gateway-service:
        condition: service_healthy
