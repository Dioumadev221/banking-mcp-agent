spring.application.name=ebank-service
server.port=8057

# See customer-service: defaults live here, the config server only overrides.
spring.config.import=optional:configserver:${CONFIG_SERVER:http://localhost:8888}

# PostgreSQL, one database owned by this service. The connection is environment
# specific (and a secret in production), so it is supplied through DB_* variables
# rather than centralised in the config server. Flyway owns the schema; Hibernate
# only validates its entities against it and never alters it.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/ebank_db}
spring.datasource.username=${DB_USERNAME:ebank}
spring.datasource.password=${DB_PASSWORD:ebank}
spring.jpa.hibernate.ddl-auto=validate

eureka.client.service-url.defaultZone=${EUREKA_SERVER:http://localhost:8761/eureka/}

# MCP server consumed by agent-service. Streamable HTTP rather than stdio: the
# agent runs in a different process, and possibly a different container.
spring.ai.mcp.server.name=ebank-mcp-server
spring.ai.mcp.server.version=1.0.0
spring.ai.mcp.server.protocol=STREAMABLE

management.endpoints.web.exposure.include=health,info
