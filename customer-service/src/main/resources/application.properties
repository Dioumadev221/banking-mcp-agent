spring.application.name=customer-service
server.port=8056

# Every service ships working defaults so the stack runs from a fresh clone.
# The config server only overrides them, and "optional:" means its absence is
# not a startup failure. Without this, cloning the repository is not enough to
# run it.
spring.config.import=optional:configserver:${CONFIG_SERVER:http://localhost:8888}

# PostgreSQL. Overridable so the same jar runs against the compose database
# (DB_URL points at the customer-db container) or a local one. Flyway creates
# and versions the schema; Hibernate only validates it, never generates it.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/customer_db}
spring.datasource.username=${DB_USERNAME:customer}
spring.datasource.password=${DB_PASSWORD:customer}
spring.jpa.hibernate.ddl-auto=validate

eureka.client.service-url.defaultZone=${EUREKA_SERVER:http://localhost:8761/eureka/}

management.endpoints.web.exposure.include=health,info
