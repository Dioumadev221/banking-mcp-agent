# Centralised settings override the defaults ebank-service ships. Only values
# that are identical in every environment belong here: the datasource is
# environment specific (and a secret in production), so it stays with the service
# and is supplied through DB_* environment variables instead.
server:
  port: 8057

spring:
  ai:
    mcp:
      server:
        name: ebank-mcp-server
        version: 1.0.0
        protocol: STREAMABLE
