spring.application.name=agent-service
server.port=8060

# Overridable so the same image runs on the host (localhost) or in a container
# (host.docker.internal), and so the model can be swapped when measuring
# tool-call reliability.
spring.ai.ollama.base-url=${OLLAMA_BASE_URL:http://localhost:11434}
spring.ai.ollama.chat.options.model=${LLM_MODEL:llama3.1}

# Low temperature: this model has to emit exact tool arguments, not prose.
spring.ai.ollama.chat.options.temperature=${LLM_TEMPERATURE:0.1}

# The agent reaches the MCP server through the gateway, so it needs no direct
# knowledge of where ebank-service runs.
spring.ai.mcp.client.streamable-http.connections.ebank.url=${EBANK_MCP_URL:http://localhost:8058}
spring.ai.mcp.client.streamable-http.connections.ebank.endpoint=/EBANK-SERVICE/mcp

# The agent is a client of the mesh, not a member of it.
eureka.client.enabled=false

management.endpoints.web.exposure.include=health,info
